name: Build AdixFX

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Download smooth UI font
        run: |
          mkdir -p src/main/resources/assets/adixfx/font
          curl -fL "https://raw.githubusercontent.com/google/fonts/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf" -o src/main/resources/assets/adixfx/font/ui.ttf

      - name: Build mod
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: AdixFX-mod
          path: |
            build/libs/adixfx-*.jar
            !build/libs/*-sources.jar
