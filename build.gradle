plugins {
    id 'fabric-loom' version '1.9.2'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // dekodowanie mp3 przy imporcie własnych utworów (CustomTracks) - dołączona do finalnego .jar
    implementation(include("javazoom:jlayer:1.0.1"))\n\n    // Vorbis encoder + Java Sound decoder for external OGG tracks.\n    implementation(include("com.github.umjammer:jVorbisEnc:365e2306fa14470aeda1d7394b375ca37963f533"))\n    implementation(include("com.github.umjammer:vavi-commons:1.1.16"))\n    implementation(include("com.googlecode.soundlibs:vorbisspi:1.0.3.3"))\n    implementation(include("com.googlecode.soundlibs:jorbis:0.0.17.4"))\n    implementation(include("com.googlecode.soundlibs:tritonus-share:0.3.7.4"))
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") { rename { "${it}_${project.base.archivesName.get()}" } }
}
